[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myagentsdk"
version = "0.1.0"
description = "A config-driven LiveKit voice-agent SDK and customer agent runner."
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.6,<2",
    "python-dotenv>=1.0",
]

[project.scripts]
myagentrunner = "myagentrunner.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["myagentsdk*", "myagentrunner*"]

[tool.setuptools.package-data]
myagentrunner = ["customer/**/*.json", "customer/**/*.md"]
